
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glitch - Login</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-container">

        <img src="assets/logo-glitch.png"
             id="logo"
             class="logo"
             alt="Glitch">

        <img src="assets/logo-glitch-fundo3.png"
             class="logo-fundo3"
             alt="">

        <img src="assets/logo-glitch-fundo2.png"
             class="logo-fundo2"
             alt="">

        <img src="assets/logo-glitch-fundo4.png"
             class="logo-fundo4"
             alt="">

        <img src="assets/logo-glitch-fundo.png"
             class="logo-fundo"
             alt="">

        <img src="assets/logo-glitch-fundo5.png"
             class="logo-fundo-esquerdo-superior"
             alt="">

        <img src="assets/logo-glitch-fundo6.png"
             class="logo-fundo-direito-superior"
             alt="">

         <input
            type="text"
            id="nome"
            placeholder="Seu nome"
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="senha"
            placeholder="Senha"
            required
        >

        <button type="button" id="loginBtn">
            Entrar
        </button>

        <p id="erro"></p>

        <p>
            Não tem uma conta?
            <a href="registro.html">Cadastre-se</a>
        </p>

    </div>

    <script type="module" src="js/app.js"></script>

</body>
</html>
