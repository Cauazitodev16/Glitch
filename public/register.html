<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glitch - Cadastro</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-container">

        <img src="assets/logo-glitch.png"
             id="logo"
             class="logo">

        <img src="assets/logo-glitch-fundo.png"
             id="logo-fundo"
             class="logo-fundo">

        <img src="assets/logo-glitch-fundo2.png"
             id="logo-fundo2"
             class="logo-fundo2">

        <img src="assets/logo-glitch-fundo-direito-inferior.png"
             id="logo-fundo-direito-inferior"
             class="logo-fundo-direito-inferior">

        <h2>Criar Conta</h2>

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="senha"
            placeholder="Senha"
        >

        <button id="btnCadastro">
            Criar Conta
        </button>

        <p id="erro"></p>

        <p>
            Já possui uma conta?
            <a href="index.html">Entrar</a>
        </p>

    </div>

    <script type="module" src="js/app.js"></script>

</body>
</html>
